version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15
    container_name: odoo_postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - odoo-db-data:/var/lib/postgresql/data/pgdata
    networks:
      - odoo-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Odoo 19
  odoo:
    image: odoo:19.0
    container_name: odoo_app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8069:8069"
      - "8072:8072"  # Longpolling
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
      - DB_PORT=5432
    volumes:
      # Módulo customizado
      - ./crm_wealth:/mnt/extra-addons/crm_wealth
      # Dados persistentes
      - odoo-web-data:/var/lib/odoo
      # Configuração customizada (opcional)
      - ./config:/etc/odoo
    networks:
      - odoo-network
    restart: unless-stopped
    command: --
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8069/web/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  odoo-web-data:
    name: odoo_web_data
  odoo-db-data:
    name: odoo_db_data

networks:
  odoo-network:
    driver: bridge
    name: odoo_network

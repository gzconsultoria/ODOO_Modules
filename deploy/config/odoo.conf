[options]
# ============================================
# ODOO 19 - PRODUCTION CONFIGURATION
# ============================================

# Database settings
db_host = db
db_port = 5432
db_user = odoo
db_password = ${POSTGRES_PASSWORD}
db_name = gzcon
db_maxconn = 64
db_template = template0

# Server settings
http_interface = 0.0.0.0
http_port = 8069
proxy_mode = True
workers = 4
max_cron_threads = 2
limit_memory_hard = 2684354560
limit_memory_soft = 2147483648
limit_request = 8192
limit_time_cpu = 600
limit_time_real = 1200

# Addons path
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/var/lib/odoo/addons/19.0,/mnt/extra-addons

# Logging
logfile = /var/log/odoo/odoo.log
log_level = info
log_handler = :INFO
logrotate = True

# Security
admin_passwd = ${ODOO_ADMIN_PASSWORD}
list_db = False
dbfilter = ^gzcon$

# Session
session_timeout = 28800

# Performance
longpolling_port = 8072

# Email (SMTP)
email_from = ${EMAIL_ADMIN}
smtp_server = ${SMTP_HOST}
smtp_port = ${SMTP_PORT}
smtp_ssl = ${SMTP_SSL}
smtp_user = ${SMTP_USER}
smtp_password = ${SMTP_PASSWORD}

# Data directory
data_dir = /var/lib/odoo

# Multi-processing
server_wide_modules = base,web
